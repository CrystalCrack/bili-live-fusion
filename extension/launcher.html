<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>bili直播融合姬</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <header><img src="assets/icon-48.png" width="36" height="36" alt=""><div><h1>bili直播融合姬</h1><span>实时直播融合工作台</span></div></header>
  <section class="saved-scene"><span class="eyebrow">已保存的场景</span><strong id="scene-name">正在读取配置…</strong><p id="scene-rooms"></p></section>
  <button id="embed-live" type="button" disabled><span>在当前直播页播放</span><small>将融合音视频流接入 B 站原生播放器</small></button>
  <a id="open-studio" href="studio.html" target="_blank" rel="noopener"><span>打开工作台</span><span aria-hidden="true">↗</span></a>
  <button id="restore-player" type="button" hidden>恢复原直播</button>
  <button id="copy-diagnostics" type="button" hidden>复制播放信息</button>
  <section id="acceleration" class="acceleration" hidden aria-label="画面加速信息"><strong id="acceleration-title"></strong><span id="acceleration-device"></span><span id="acceleration-details"></span></section>
  <p id="launch-status" role="status" aria-live="polite">正在检查当前页面…</p>
  <p class="hint">网页模式融合画面与声音，沿用网页聊天区</p>
  <script type="module" src="launcher.js"></script>
</body>
</html>
