<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>三路融合姬 · 观看</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="watch.css">
</head>
<body>
  <main id="watch-player" aria-label="融合直播播放器">
    <div id="watch-picture" class="watch-picture">
      <video id="watch-video" autoplay muted playsinline aria-label="融合直播画面"></video>
      <div id="watch-danmaku" class="watch-danmaku" aria-label="实时弹幕，悬停或聚焦后可互动"></div>
      <header class="watch-heading watch-chrome"><span><i class="live-dot"></i>融合直播</span><button id="watch-studio" type="button">返回工作台 ↗</button></header>
      <div id="watch-state" class="watch-state" role="status"><img src="assets/icon.svg" width="44" height="44" alt=""><h1>正在连接融合直播</h1><p>画面和声音由工作台实时传来</p><button id="watch-retry" type="button">重新连接</button></div>
      <div class="watch-controls watch-chrome">
        <button id="watch-play" type="button" aria-label="暂停" title="暂停 / 继续（空格）">暂停</button>
        <button id="watch-audio" type="button" aria-pressed="false" title="声音开关（M）">开启声音</button>
        <input id="watch-volume" type="range" min="0" max="100" value="80" aria-label="观看音量">
        <span class="watch-live"><i class="live-dot"></i>直播</span><span class="control-spacer"></span>
        <button id="watch-toggle-danmaku" type="button" aria-pressed="true">弹幕 开</button>
        <button id="watch-fullscreen" type="button" title="全屏（F）" aria-pressed="false">全屏</button>
      </div>
    </div>
    <footer class="watch-footer">
      <form id="watch-send-form" class="watch-send-form">
        <select id="watch-send-target" aria-label="发送弹幕到"><option value="A">发送到 A</option><option value="B">发送到 B</option><option value="both">A + B</option></select>
        <input id="watch-send-text" aria-label="弹幕内容" placeholder="发个弹幕，一起聊聊" maxlength="200" autocomplete="off">
        <span id="watch-text-count" class="watch-text-count">0/30</span><button id="watch-send" class="send-button" type="submit" disabled>发送</button>
      </form>
      <span id="watch-notice" class="watch-notice" role="status" aria-live="polite">悬停弹幕可复制或 +1 发送</span>
    </footer>
  </main>
  <script type="module" src="watch.js"></script>
</body>
</html>
